<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hide Amazon Deals</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1 class="popup__title">Hide Amazon Deals</h1>
      <label class="popup__toggle">
        <span>Hide Amazon deals</span>
        <input id="enabled-toggle" type="checkbox" />
      </label>
      <p id="count-message" class="popup__count" aria-live="polite"></p>
      <p id="status-message" class="popup__status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
